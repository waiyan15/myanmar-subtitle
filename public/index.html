<!DOCTYPE html>
<html lang="my">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Myanmar Subtitle Translator</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        Arial,
        "Noto Sans Myanmar",
        sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow:
        0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .upload-box {
      border: 2px dashed #aaa;
      border-radius: 14px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-box:hover {
      border-color: #333;
    }

    input[type="file"] {
      display: none;
    }

    .file-name {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
      word-break: break-all;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .progress-area {
      display: none;
      margin-top: 25px;
    }

    .progress-text {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .progress-bar {
      width: 100%;
      height: 18px;
      background: #e5e5e5;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #222;
      transition: width 0.3s ease;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      color: #666;
      font-size: 14px;
    }

    .download {
      display: none;
      margin-top: 20px;
      text-align: center;
    }

    .download a {
      display: block;
      padding: 14px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }

    .error {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #ffe5e5;
      color: #b00000;
      white-space: pre-wrap;
      word-break: break-word;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>🇲🇲 Myanmar Subtitle</h1>

    <div class="subtitle">
      SRT ဖိုင်ကို မြန်မာဘာသာသို့ အလိုအလျောက် ဘာသာပြန်ပါ
    </div>


    <label
      class="upload-box"
      for="srtFile"
    >
      📄 SRT ဖိုင်ရွေးရန်

      <div class="file-name" id="fileName">
        SRT ဖိုင်တစ်ခုရွေးပါ
      </div>
    </label>

    <input
      id="srtFile"
      type="file"
      accept=".srt"
    >


    <button
      id="translateBtn"
      disabled
    >
      မြန်မာလို ဘာသာပြန်မည်
    </button>


    <div
      class="progress-area"
      id="progressArea"
    >

      <div
        class="progress-text"
        id="progressText"
      >
        0%
      </div>

      <div class="progress-bar">

        <div
          class="progress-fill"
          id="progressFill"
        ></div>

      </div>

      <div
        class="status"
        id="status"
      >
        ဘာသာပြန်ရန် ပြင်ဆင်နေပါသည်...
      </div>

    </div>


    <div
      class="download"
      id="downloadArea"
    >

      <a
        id="downloadLink"
        href="#"
      >
        ⬇️ Myanmar SRT Download
      </a>

    </div>


    <div
      class="error"
      id="errorBox"
    ></div>

  </div>


<script>

const fileInput =
  document.getElementById("srtFile");

const fileName =
  document.getElementById("fileName");

const translateBtn =
  document.getElementById("translateBtn");

const progressArea =
  document.getElementById("progressArea");

const progressText =
  document.getElementById("progressText");

const progressFill =
  document.getElementById("progressFill");

const status =
  document.getElementById("status");

const downloadArea =
  document.getElementById("downloadArea");

const downloadLink =
  document.getElementById("downloadLink");

const errorBox =
  document.getElementById("errorBox");


let selectedFile = null;


// =====================================
// File selected
// =====================================

fileInput.addEventListener(
  "change",
  () => {

    selectedFile =
      fileInput.files[0];

    if (selectedFile) {

      fileName.textContent =
        selectedFile.name;

      translateBtn.disabled =
        false;

      downloadArea.style.display =
        "none";

      errorBox.style.display =
        "none";
    }

  }
);


// =====================================
// Progress animation
// =====================================

function setProgress(
  percent,
  message
) {

  percent =
    Math.max(
      0,
      Math.min(100, percent)
    );

  progressText.textContent =
    `${percent}%`;

  progressFill.style.width =
    `${percent}%`;

  if (message) {
    status.textContent =
      message;
  }
}


// =====================================
// Translate
// =====================================

translateBtn.addEventListener(
  "click",
  async () => {

    if (!selectedFile) {
      return;
    }

    translateBtn.disabled =
      true;

    progressArea.style.display =
      "block";

    downloadArea.style.display =
      "none";

    errorBox.style.display =
      "none";


    setProgress(
      5,
      "SRT ဖိုင်ကို ဖတ်နေပါသည်..."
    );


    const formData =
      new FormData();

    formData.append(
      "srt",
      selectedFile
    );


    try {

      setProgress(
        10,
        "Gemini ထံ ပို့နေပါသည်..."
      );


      /*
       * Since the server translates in batches,
       * we show a smooth progress indicator.
       */

      let fakeProgress = 10;

      const progressTimer =
        setInterval(() => {

          if (fakeProgress < 90) {

            fakeProgress += 2;

            setProgress(
              fakeProgress,
              "ဘာသာပြန်နေပါသည်..."
            );

          }

        }, 1200);


      const response =
        await fetch(
          "/translate-srt",
          {
            method: "POST",
            body: formData
          }
        );


      clearInterval(progressTimer);


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "ဘာသာပြန်ရာတွင် Error ဖြစ်နေပါတယ်။"
        );

      }


      setProgress(
        100,
        "ဘာသာပြန်ပြီးပါပြီ ✓"
      );


      // =================================
      // Download Myanmar SRT
      // =================================

      const blob =
        new Blob(
          [data.srt],
          {
            type:
              "text/plain;charset=utf-8"
          }
        );


      const url =
        URL.createObjectURL(blob);


      const originalName =
        selectedFile.name
          .replace(
            /\.srt$/i,
            ""
          );


      downloadLink.href =
        url;

      downloadLink.download =
        `${originalName}_Myanmar.srt`;


      downloadArea.style.display =
        "block";


    } catch (error) {

      setProgress(
        0,
        "ဘာသာပြန်မအောင်မြင်ပါ"
      );

      errorBox.textContent =
        "❌ Error\n\n" +
        error.message;

      errorBox.style.display =
        "block";

    } finally {

      translateBtn.disabled =
        false;

    }

  }
);

</script>

</body>
</html>
