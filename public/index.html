<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Myanmar Subtitle Translator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      font-family:
        Arial,
        "Noto Sans Myanmar",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f5f3ff,
          #eef7ff
        );

      color: #222;
    }

    .container {
      width: 100%;
      max-width: 620px;

      margin: 40px auto;

      padding: 30px;

      background: rgba(255,255,255,0.92);

      border-radius: 24px;

      box-shadow:
        0 15px 50px rgba(60,40,120,0.12);

      border: 1px solid rgba(255,255,255,0.8);
    }

    .logo {
      width: 70px;
      height: 70px;

      margin: 0 auto 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #4f46e5
        );

      font-size: 34px;

      box-shadow:
        0 10px 25px rgba(79,70,229,0.25);
    }

    h1 {
      text-align: center;

      margin: 0;

      font-size: 28px;

      font-weight: 800;
    }

    .subtitle {
      text-align: center;

      margin-top: 10px;
      margin-bottom: 28px;

      color: #777;

      font-size: 14px;

      line-height: 1.6;
    }

    .upload-box {
      display: block;

      border: 2px dashed #c8c5d8;

      border-radius: 18px;

      padding: 32px 20px;

      text-align: center;

      cursor: pointer;

      background: #fafaff;

      transition: 0.25s;
    }

    .upload-box:hover {
      border-color: #7c3aed;

      background: #f8f5ff;
    }

    .upload-icon {
      font-size: 42px;

      margin-bottom: 10px;
    }

    .upload-title {
      font-size: 17px;

      font-weight: bold;

      color: #333;
    }

    .upload-hint {
      margin-top: 7px;

      font-size: 13px;

      color: #888;
    }

    input[type="file"] {
      display: none;
    }

    .file-name {
      margin-top: 16px;

      padding: 10px;

      border-radius: 10px;

      background: #f0eef8;

      font-size: 13px;

      color: #555;

      word-break: break-all;
    }

    button {
      width: 100%;

      margin-top: 20px;

      padding: 15px;

      border: 0;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #4f46e5
        );

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(79,70,229,0.25);

      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);

      box-shadow:
        0 10px 25px rgba(79,70,229,0.32);
    }

    button:disabled {
      background: #bbb;

      box-shadow: none;

      cursor: not-allowed;
    }

    /* ==========================
       Progress
    ========================== */

    .progress-area {
      display: none;

      margin-top: 28px;

      padding: 22px;

      border-radius: 18px;

      background: #f8f7ff;

      border: 1px solid #ebe8ff;
    }

    .progress-top {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 12px;
    }

    .progress-label {
      font-size: 14px;

      color: #666;
    }

    .progress-percent {
      font-size: 25px;

      font-weight: 800;

      color: #5b21b6;
    }

    .progress-bar {
      width: 100%;

      height: 14px;

      background: #e7e5ee;

      border-radius: 20px;

      overflow: hidden;
    }

    .progress-fill {
      width: 0%;

      height: 100%;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          #7c3aed,
          #4f46e5
        );

      transition:
        width 0.4s ease;
    }

    .progress-count {
      margin-top: 12px;

      text-align: center;

      font-size: 14px;

      font-weight: bold;

      color: #555;
    }

    .status {
      margin-top: 8px;

      text-align: center;

      font-size: 13px;

      color: #777;

      line-height: 1.5;
    }

    /* ==========================
       Download
    ========================== */

    .download {
      display: none;

      margin-top: 22px;
    }

    .download a {
      display: block;

      padding: 15px;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          #16a34a,
          #15803d
        );

      color: white;

      text-decoration: none;

      border-radius: 14px;

      font-size: 16px;

      font-weight: bold;

      box-shadow:
        0 8px 20px rgba(22,163,74,0.22);
    }

    /* ==========================
       Error
    ========================== */

    .error {
      display: none;

      margin-top: 20px;

      padding: 15px;

      border-radius: 12px;

      background: #fff0f0;

      border: 1px solid #ffd0d0;

      color: #b00020;

      white-space: pre-wrap;

      word-break: break-word;

      font-size: 14px;

      line-height: 1.5;
    }

    /* ==========================
       Mobile
    ========================== */

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .container {
        margin: 15px auto;

        padding: 22px 17px;

        border-radius: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .upload-box {
        padding: 27px 15px;
      }

      .progress-area {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      🇲🇲
    </div>

    <h1>
      Myanmar Subtitle
    </h1>

    <div class="subtitle">
      SRT ဖိုင်ကို မြန်မာဘာသာသို့
      အလိုအလျောက် ဘာသာပြန်ပေးပါသည်
    </div>


    <!-- ==========================
         Upload
    =========================== -->

    <label
      class="upload-box"
      for="srtFile"
    >

      <div class="upload-icon">
        📄
      </div>

      <div class="upload-title">
        SRT ဖိုင်ရွေးရန်
      </div>

      <div class="upload-hint">
        .srt ဖိုင်တစ်ခုသာ ရွေးပါ
      </div>

      <div
        class="file-name"
        id="fileName"
      >
        SRT ဖိုင်တစ်ခု မရွေးရသေးပါ
      </div>

    </label>


    <input
      id="srtFile"
      type="file"
      accept=".srt"
    >


    <!-- ==========================
         Translate Button
    =========================== -->

    <button
      id="translateBtn"
      disabled
    >
      🌐 မြန်မာလို ဘာသာပြန်မည်
    </button>


    <!-- ==========================
         Real Progress
    =========================== -->

    <div
      class="progress-area"
      id="progressArea"
    >

      <div class="progress-top">

        <div class="progress-label">
          ဘာသာပြန်နေပါသည်
        </div>

        <div
          class="progress-percent"
          id="progressText"
        >
          0%
        </div>

      </div>


      <div class="progress-bar">

        <div
          class="progress-fill"
          id="progressFill"
        ></div>

      </div>


      <div
        class="progress-count"
        id="progressCount"
      >
        0 / 0 subtitles
      </div>


      <div
        class="status"
        id="status"
      >
        ပြင်ဆင်နေပါသည်...
      </div>

    </div>


    <!-- ==========================
         Download
    =========================== -->

    <div
      class="download"
      id="downloadArea"
    >

      <a
        id="downloadLink"
        href="#"
      >
        ⬇️ Myanmar SRT Download
      </a>

    </div>


    <!-- ==========================
         Error
    =========================== -->

    <div
      class="error"
      id="errorBox"
    ></div>

  </div>


<script>

const fileInput =
  document.getElementById("srtFile");

const fileName =
  document.getElementById("fileName");

const translateBtn =
  document.getElementById("translateBtn");

const progressArea =
  document.getElementById("progressArea");

const progressText =
  document.getElementById("progressText");

const progressFill =
  document.getElementById("progressFill");

const progressCount =
  document.getElementById("progressCount");

const status =
  document.getElementById("status");

const downloadArea =
  document.getElementById("downloadArea");

const downloadLink =
  document.getElementById("downloadLink");

const errorBox =
  document.getElementById("errorBox");


let selectedFile = null;


/* ================================
   File Selected
================================ */

fileInput.addEventListener(
  "change",
  () => {

    selectedFile =
      fileInput.files[0];

    if (!selectedFile) {
      return;
    }

    fileName.textContent =
      selectedFile.name;

    translateBtn.disabled =
      false;

    downloadArea.style.display =
      "none";

    errorBox.style.display =
      "none";

    progressArea.style.display =
      "none";

  }
);


/* ================================
   Set Real Progress
================================ */

function setProgress(
  percent,
  completed,
  total,
  message
) {

  percent =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent) || 0
      )
    );

  progressText.textContent =
    `${Math.round(percent)}%`;

  progressFill.style.width =
    `${percent}%`;

  progressCount.textContent =
    `${completed || 0} / ${total || 0} subtitles`;

  if (message) {
    status.textContent =
      message;
  }

}


/* ================================
   Translate
================================ */

translateBtn.addEventListener(
  "click",
  async () => {

    if (!selectedFile) {
      return;
    }


    translateBtn.disabled =
      true;

    progressArea.style.display =
      "block";

    downloadArea.style.display =
      "none";

    errorBox.style.display =
      "none";


    setProgress(
      0,
      0,
      0,
      "SRT ဖိုင်ကို ပို့နေပါသည်..."
    );


    const formData =
      new FormData();

    formData.append(
      "srt",
      selectedFile
    );


    let eventSource = null;


    try {

      /* ==========================
         Create Translation Job
      =========================== */

      const response =
        await fetch(
          "/translate-srt",
          {
            method: "POST",
            body: formData
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "ဘာသာပြန်ရန် မအောင်မြင်ပါ။"
        );

      }


      /*
       * Server should return:
       * { jobId: "xxxxx" }
       */

      const jobId =
        data.jobId;


      if (!jobId) {

        throw new Error(
          "Server မှ Job ID မရရှိပါ။"
        );

      }


      setProgress(
        0,
        0,
        0,
        "ဘာသာပြန်ခြင်း စတင်နေပါသည်..."
      );


      /* ==========================
         Real-time SSE Progress
      =========================== */

      eventSource =
        new EventSource(
          `/progress/${jobId}`
        );


      eventSource.onmessage =
        async (event) => {

          try {

            const progress =
              JSON.parse(
                event.data
              );


            /*
             * Expected server data:
             *
             * {
             *   progress: 50,
             *   completed: 30,
             *   total: 60,
             *   status: "..."
             * }
             */


            if (
              progress.progress !== undefined
            ) {

              setProgress(
                progress.progress,
                progress.completed,
                progress.total,
                progress.status
              );

            }


            /* ======================
               Completed
            ======================= */

            if (
              progress.status === "completed" ||
              progress.status === "done" ||
              progress.progress >= 100
            ) {

              eventSource.close();

              setProgress(
                100,
                progress.total,
                progress.total,
                "ဘာသာပြန်ပြီးပါပြီ ✓"
              );


              /*
               * Get final SRT
               */

              const resultResponse =
                await fetch(
                  `/result/${jobId}`
                );


              const resultData =
                await resultResponse.json();


              if (!resultResponse.ok) {

                throw new Error(
                  resultData.error ||
                  "SRT ဖိုင်ရယူ၍ မရပါ။"
                );

              }


              const blob =
                new Blob(
                  [resultData.srt],
                  {
                    type:
                      "text/plain;charset=utf-8"
                  }
                );


              const url =
                URL.createObjectURL(
                  blob
                );


              const originalName =
                selectedFile.name.replace(
                  /\.srt$/i,
                  ""
                );


              downloadLink.href =
                url;

              downloadLink.download =
                `${originalName}_Myanmar.srt`;


              downloadArea.style.display =
                "block";


              translateBtn.disabled =
                false;

            }


            /* ======================
               Failed
            ======================= */

            if (
              progress.status === "failed" ||
              progress.status === "error"
            ) {

              eventSource.close();

              throw new Error(
                progress.error ||
                "ဘာသာပြန်ရာတွင် Error ဖြစ်နေပါတယ်။"
              );

            }

          } catch (err) {

            eventSource.close();

            errorBox.textContent =
              "❌ Error\n\n" +
              err.message;

            errorBox.style.display =
              "block";

            translateBtn.disabled =
              false;

          }

        };


      eventSource.onerror =
        async () => {

          /*
           * Don't immediately show an error.
           *
           * SSE can disconnect temporarily.
           */

          if (eventSource) {
            eventSource.close();
          }

          /*
           * Check final result.
           */

          try {

            const check =
              await fetch(
                `/result/${jobId}`
              );


            if (check.ok) {

              const result =
                await check.json();


              if (result.srt) {

                setProgress(
                  100,
                  1,
                  1,
                  "ဘာသာပြန်ပြီးပါပြီ ✓"
                );


                const blob =
                  new Blob(
                    [result.srt],
                    {
                      type:
                        "text/plain;charset=utf-8"
                    }
                  );


                const url =
                  URL.createObjectURL(
                    blob
                  );


                const originalName =
                  selectedFile.name.replace(
                    /\.srt$/i,
                    ""
                  );


                downloadLink.href =
                  url;

                downloadLink.download =
                  `${originalName}_Myanmar.srt`;


                downloadArea.style.display =
                  "block";


                translateBtn.disabled =
                  false;

                return;
              }

            }

          } catch (e) {
            // ignore temporary SSE error
          }


          errorBox.textContent =
            "❌ Connection Error\n\n" +
            "Server နှင့် ချိတ်ဆက်မှု ပြတ်တောက်သွားပါတယ်။";

          errorBox.style.display =
            "block";

          translateBtn.disabled =
            false;

        };


    } catch (error) {

      if (eventSource) {
        eventSource.close();
      }


      setProgress(
        0,
        0,
        0,
        "ဘာသာပြန်မအောင်မြင်ပါ"
      );


      errorBox.textContent =
        "❌ Error\n\n" +
        error.message;

      errorBox.style.display =
        "block";


      translateBtn.disabled =
        false;

    }

  }
);

</script>

</body>
</html>
